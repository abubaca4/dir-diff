[package]
name = "dir-patch"
version = "0.2.0"
edition = "2024"

[profile.release]
strip = true
lto = true
panic = 'abort'

[dependencies]
clap = { version = "4.5", features = ["derive"] }
walkdir = "2.5"
pathdiff = "0.2"
image = "0.25"
rayon = "1.10"
blake3 = "1.5"
colored = "2.1"
mimalloc = "0.1"

[build-dependencies]
winres = "0.1"
